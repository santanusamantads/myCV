<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My CV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Professional Welcoming Splash Intro -->
<div id="welcomeSplash" class="welcome-overlay no-print">
  <div class="welcome-card">
    <div class="welcome-avatar-wrapper">
      <img id="welcomePhoto" src="" alt="Santanu Samanta" class="welcome-avatar">
    </div>
    <div class="welcome-badge">Welcome to my Portfolio</div>
    <h1 class="welcome-name">Santanu Samanta</h1>
    <div class="welcome-line"></div>
    <p class="welcome-sub">M.Sc. Data Science & AI Student</p>
  </div>
</div>

<header class="topbar no-print">
  <nav id="nav"></nav>
  <div class="actions">
    <button id="btnTheme" title="Toggle dark / light">◐</button>
    <button id="btnPrint" title="Print or save as PDF">PDF</button>
    <button id="btnEdit" class="primary">✎ Edit</button>
  </div>
</header>

<main id="cv"></main>
<footer class="no-print">Built with plain HTML/CSS/JS · hosted on GitHub Pages</footer>

<!-- Editor drawer -->
<aside id="editor" class="no-print" hidden>
  <div class="ed-head">
    <strong>Edit CV</strong>
    <button id="btnClose">✕</button>
  </div>
  <div class="ed-body" id="edBody"></div>
  <div class="ed-foot">
    <button id="btnExport" class="primary">⬇ Download data.json</button>
    <button id="btnImport">⬆ Import</button>
    <button id="btnReset" class="danger">Reset</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
    <p class="hint">Changes auto-save in this browser. To publish them for everyone, download <code>data.json</code>, put it in your repo and commit.</p>
  </div>
</aside>

<!-- Photo Full-View Lightbox Modal -->
<div id="photoModal" class="photo-lightbox" hidden>
  <span class="lightbox-close">&times;</span>
  <img id="lightboxImg" class="lightbox-content" alt="Full view">
</div>

<script src="app.js"></script>
</body>
</html>
